name: Tallyburn
options:
  bundleIdPrefix: io.github.seoulpro
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Tallyburn:
    type: application
    platform: macOS
    sources:
      - path: Tallyburn
        excludes:
          - Info.plist
      - path: Resources/sidecar-defaults.json
        buildPhase: resources
      - path: ../../LICENSE
        name: LICENSE
        buildPhase: resources
      - path: ../../NOTICE
        name: NOTICE
        buildPhase: resources
    info:
      path: Tallyburn/Info.plist
      properties:
        CFBundleDisplayName: Tallyburn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Sumin Lim. Licensed under Apache-2.0.
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.seoulpro.Tallyburn
        PRODUCT_NAME: Tallyburn
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
    postBuildScripts:
      - name: Embed collection engine
        basedOnDependencyAnalysis: false
        script: |
          if [[ -n "${TALLYBURN_ENGINE_EXECUTABLE:-}" ]]; then
            if [[ -z "${TALLYBURN_ENGINE_NOTICES:-}" ]]; then
              echo "TALLYBURN_ENGINE_NOTICES is required when embedding an engine." >&2
              exit 65
            fi
            "$SRCROOT/../../scripts/embed-macos-engine.sh" \
              "$TALLYBURN_ENGINE_EXECUTABLE" \
              "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH" \
              "$ARCHS" \
              "$TALLYBURN_ENGINE_NOTICES"
          fi
  TallyburnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TallyburnTests
    dependencies:
      - target: Tallyburn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.seoulpro.TallyburnTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Tallyburn:
    build:
      targets:
        Tallyburn: all
        TallyburnTests:
          - test
    test:
      targets:
        - TallyburnTests
