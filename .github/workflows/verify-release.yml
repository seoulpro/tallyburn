name: Verify release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  npm:
    name: Published npm · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      TALLYBURN_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify published npm package
        shell: bash
        run: node scripts/verify-public-npm.mjs "$TALLYBURN_RELEASE_VERSION"

  macos:
    name: Published macOS app and npm
    runs-on: macos-26
    env:
      TALLYBURN_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify published release artifacts
        run: ./scripts/verify-release-artifacts.sh "$TALLYBURN_RELEASE_VERSION"
